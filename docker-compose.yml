services:

  # Named "bizzflowuk-api", not "api": on the shared external "coolify"
  # network, Docker Compose auto-registers the service name as a DNS alias —
  # a generic "api" collides with any other project on the same host that
  # also names its backend service "api" (confirmed live: `nslookup api`
  # from the web container returned two different IPs, ours and another
  # project's, and nginx's resolver would nondeterministically pick either —
  # causing intermittent requests to be silently routed to a different app).
  bizzflowuk-api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PRIVATE_UPLOAD_DIR: /data/uploads
      # Public origin, used to build customer-facing links (payment pages, the
      # private calendar feed URL). Falls back to bizzflowuk.com if unset.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://bizzflowuk.com}
      # Shared secret for the scheduled job endpoints under /internal/jobs/*.
      # Optional on purpose: while it is unset those endpoints return 404, so a
      # deploy without it is safe — the automations simply never sweep. Set it in
      # Coolify and point a daily scheduled task at the automations job.
      JOBS_SECRET: ${JOBS_SECRET:-}

      # Flo, the in-dashboard assistant. Optional: without it the endpoint
      # returns a plain "not switched on yet" rather than failing oddly.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Google Business reviews pulled onto tenant sites. Needs Places API (New)
      # enabled on the key. Unset, the sync stays idle and manually entered
      # reviews still work.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}

      # BizzFlowUK's OWN subscription, on the platform Stripe account. Not to be
      # confused with tenant_settings.stripe_* , which is each tenant's own
      # account for taking money from THEIR customers. Two accounts, two
      # directions of money; they must never be crossed.
      # Without these, billing endpoints answer 503 and nothing else changes.
      PLATFORM_STRIPE_SECRET_KEY: ${PLATFORM_STRIPE_SECRET_KEY:-}
      PLATFORM_STRIPE_PRICE_ID: ${PLATFORM_STRIPE_PRICE_ID:-}
      PLATFORM_STRIPE_WEBHOOK_SECRET: ${PLATFORM_STRIPE_WEBHOOK_SECRET:-}

      # Operational escape hatches. All optional, all default to off, and all
      # useless unless named here — Coolify only passes variables the compose
      # file declares, so a value set in the UI and absent from this list simply
      # never reaches the container.
      # Set to "1" to stop the hourly automation sweep without a code change.
      AUTOMATIONS_DISABLED: ${AUTOMATIONS_DISABLED:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # One-time seeding passwords, same pattern as MARK_LOGIN_PASSWORD above:
      # set, deploy, log in, then REMOVE.
      AMO_ADMIN_PASSWORD: ${AMO_ADMIN_PASSWORD:-}
      KD_ADMIN_PASSWORD: ${KD_ADMIN_PASSWORD:-}
      RETIRE_LEGACY_AMO_LOGIN: ${RETIRE_LEGACY_AMO_LOGIN:-}
      # Only used for the one-time platform-admin bootstrap (see seedFix.ts) —
      # safe to remove from the environment after first successful deploy.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # One-time password recovery for mark@amorendering.co.uk. Set it in Coolify, deploy, log in,
      # then remove it. Passed to the runtime container so the seed can reset the password.
      MARK_LOGIN_PASSWORD: ${MARK_LOGIN_PASSWORD:-}
      # Break-glass for the platform admin (/admin). SEED_ADMIN_PASSWORD cannot do this —
      # ensurePlatformUsers uses onConflictDoNothing and never touches an existing account.
      # PLATFORM_ADMIN_PASSWORD create-or-RESETS the account and forces it to SUPER_ADMIN with
      # tenantId null; PLATFORM_ADMIN_EMAIL retargets it at a different login. Set in Coolify,
      # deploy, log in, then REMOVE — while set, every deploy resets that password, so a change
      # made in the app is silently reverted on the next boot.
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
    volumes:
      - api-uploads:/data/uploads
    networks:
      - app-net
      - coolify

  web:
    build:
      context: .
      dockerfile: artifacts/web/Dockerfile.web
      args:
        PORT: 3000
        BASE_PATH: /
    restart: unless-stopped
    environment:
      API_UPSTREAM: bizzflowuk-api:8080
      SERVICE_FQDN_WEB_80:
    depends_on:
      - bizzflowuk-api
    networks:
      - app-net
      - coolify

networks:
  app-net:
    driver: bridge
  coolify:
    external: true

volumes:
  api-uploads:
